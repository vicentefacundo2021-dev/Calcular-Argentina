<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Días Hábiles y Entre Fechas - Calcular Argentina</title>

  <meta name="description" content="Calculadora de fechas online gratis para Argentina. Calculá cuántos días de corrido y días hábiles hay entre dos fechas fácilmente.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #e1e1e1;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
      display: none;
    }

    .resultado h3 {
      margin-top: 0;
      text-align: center;
      color: #222;
    }

    .dato-tiempo {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0;
      color: #0d6efd;
      text-align: center;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>📅 Calculadora entre Fechas</h1>
    <p>Calcular Argentina</p>
  </header>

  <main>

    <div class="calculadora">

      <label for="fecha1">Fecha de inicio</label>
      <input type="date" id="fecha1">

      <label for="fecha2">Fecha de fin</label>
      <input type="date" id="fecha2">

      <button onclick="calcularTiempo()">Calcular Diferencia</button>

      <div class="resultado" id="resultado"></div>

    </div>

    <a class="volver" href="index.html">
      ← Volver al Inicio
    </a>

  </main>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>
    // Setea la fecha de hoy por defecto al cargar la página
    window.onload = function() {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById("fecha1").value = hoy;
      document.getElementById("fecha2").value = hoy;
    };

    function calcularTiempo() {
      const f1Input = document.getElementById("fecha1").value;
      const f2Input = document.getElementById("fecha2").value;
      const resultadoDiv = document.getElementById("resultado");

      if (!f1Input || !f2Input) {
        resultadoDiv.style.display = "block";
        resultadoDiv.innerHTML = "Por favor, ingresá ambas fechas.";
        return;
      }

      const fechaInicio = new Date(f1Input + "T00:00:00");
      const fechaFin = new Date(f2Input + "T00:00:00");

      // Invertir si la fecha de inicio es posterior a la de fin
      let permutar = false;
      let inicio = fechaInicio;
      let fin = fechaFin;
      if (fechaInicio > fechaFin) {
        inicio = fechaFin;
        fin = fechaInicio;
        permutar = true;
      }

      // 1. Calcular días totales de corrido
      const diffMilisegundos = fin - inicio;
      const diasCorrido = Math.floor(diffMilisegundos / (1000 * 60 * 60 * 24));

      // 2. Calcular días hábiles (excluyendo Sábados y Domingos)
      let diasHabiles = 0;
      let fechaAux = new Date(inicio.getTime());
      
      while (fechaAux < fin) {
        fechaAux.setDate(fechaAux.getDate() + 1);
        const diaSemana = fechaAux.getDay();
        if (diaSemana !== 0 && diaSemana !== 6) { // 0 = Domingo, 6 = Sábado
          diasHabiles++;
        }
      }

      // 3. Desglose detallado en Meses y Días
      let anios = fin.getFullYear() - inicio.getFullYear();
      let meses = fin.getMonth() - inicio.getMonth();
      let dias = fin.getDate() - inicio.getDate();

      if (dias < 0) {
        meses--;
        // Conseguir los días del mes anterior
        const mesAnterior = new Date(fin.getFullYear(), fin.getMonth(), 0).getDate();
        dias += mesAnterior;
      }
      if (meses < 0) {
        anios--;
        meses += 12;
      }

      let textoDesglose = "";
      if (anios > 0) textoDesglose += anios + (anios === 1 ? " año, " : " años, ");
      if (meses > 0) textoDesglose += meses + (meses === 1 ? " mes y " : " meses y ");
      textoDesglose += dias + (dias === 1 ? " día" : " días");

      // Renderizar el resultado
      resultadoDiv.innerHTML = `
        <h3>📊 Resultado del Cálculo</h3>
        ${permutar ? '<p style="color:#b94a00; font-size:14px; text-align:center;">⚠️ <em>Nota: Se invirtieron las fechas para el cálculo.</em></p>' : ''}
        
        <p>📆 <strong>Días totales (de corrido):</strong></p>
        <div class="dato-tiempo">${diasCorrido} días</div>
        
        <p>💼 <strong>Días hábiles (Lunes a Viernes):</strong></p>
        <div class="dato-tiempo" style="color: #198754;">${diasHabiles} días laborales</div>
        
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <p style="text-align: center; font-size: 15px;"><strong>Equivale de forma desglosada a:</strong><br>${textoDesglose}.</p>
      `;

      resultadoDiv.style.display = "block";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadoras de Dinero - Calcular Argentina</title>

  <meta name="description" content="Calculadoras de dinero online gratis para Argentina. IVA, aumentos, descuentos, cuotas e intereses.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 30px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .calculadoras {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px 15px;
      text-align: center;
      border: 1px solid #e1e1e1;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      color: #222;
      display: block;
      transition: 0.2s;
    }

    .calculadora:hover {
      transform: translateY(-3px);
    }

    .emoji {
      display: block;
      font-size: 35px;
      margin-bottom: 10px;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💰 Calculadoras de Dinero</h1>
    <p>Calcular Argentina</p>
  </header>

  <main>

    <h2>Elegí qué querés calcular</h2>

    <div class="calculadoras">

      <a href="#" class="calculadora">
        <span class="emoji">🧾</span>
        Calculadora de IVA
      </a>

      <a href="#" class="calculadora">
        <span class="emoji">📈</span>
        Aumentos y descuentos
      </a>

      <a href="#" class="calculadora">
        <span class="emoji">💳</span>
        Cuotas
      </a>

      <a href="#" class="calculadora">
        <span class="emoji">💰</span>
        Intereses
      </a>

    </div>

    <a class="volver" href="index.html">
      ← Volver a Calcular Argentina
    </a>

  </main>

  <footer>
    © 2026 Calcular Argentina
  </footer>

</body>
</html>

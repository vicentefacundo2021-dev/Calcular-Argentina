<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de IMC y Peso Ideal - Calcular Argentina</title>

  <meta name="description" content="Calculadora de Índice de Masa Corporal (IMC) online gratis. Calculá tu estado nutricional y descubrí tu rango de peso ideal de forma fácil.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #e1e1e1;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
      display: none;
    }

    .resultado h3 {
      margin-top: 0;
      text-align: center;
      color: #222;
    }

    .dato-destacado {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      color: #0d6efd;
    }

    .advertencia-salud {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 15px;
      line-height: 1.4;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>❤️ Calculadora de IMC y Peso Ideal</h1>
    <p>Calcular Argentina</p>
  </header>

  <main>

    <div class="calculadora">

      <label for="peso">Tu peso actual (en Kilos)</label>
      <input type="number" id="peso" placeholder="Ej: 75" min="10" step="0.1">

      <label for="altura">Tu altura (en Centímetros)</label>
      <input type="number" id="altura" placeholder="Ej: 175" min="50">

      <button onclick="calcularIMC()">Calcular mi IMC</button>

      <div class="resultado" id="resultado"></div>

    </div>

    <a class="volver" href="index.html">
      ← Volver al Inicio
    </a>

  </main>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>
    function calcularIMC() {
      const peso = parseFloat(document.getElementById("peso").value);
      const alturaCm = parseFloat(document.getElementById("altura").value);
      const resultadoDiv = document.getElementById("resultado");

      if (isNaN(peso) || isNaN(alturaCm) || peso <= 0 || alturaCm <= 0) {
        resultadoDiv.style.display = "block";
        resultadoDiv.innerHTML = "Por favor, ingresá valores válidos de peso y altura.";
        return;
      }

      // Convertir altura a metros
      const alturaM = alturaCm / 100;
      
      // Fórmula del IMC: peso / (altura^2)
      const imc = peso / (alturaM * alturaM);

      // Determinar la categoría según la OMS
      let estado = "";
      let colorEstado = "";
      
      if (imc < 18.5) {
        estado = "Bajo peso";
        colorEstado = "#6c757d"; // Gris
      } else if (imc >= 18.5 && imc < 25) {
        estado = "Peso normal (Saludable)";
        colorEstado = "#198754"; // Verde
      } else if (imc >= 25 && imc < 30) {
        estado = "Sobrepeso";
        colorEstado = "#fd7e14"; // Naranja
      } else {
        estado = "Obesidad";
        colorEstado = "#dc3545"; // Rojo
      }

      // Calcular rango de peso ideal para esa altura (IMC entre 18.5 y 24.9)
      const pesoMin = 18.5 * (alturaM * alturaM);
      const pesoMax = 24.9 * (alturaM * alturaM);

      resultadoDiv.innerHTML = `
        <h3>📊 Tu Evaluación Nutricional</h3>
        <p>Tu Índice de Masa Corporal es:</p>
        <div class="dato-destacado">${imc.toLocaleString("es-AR", { maximumFractionDigits: 1 })}</div>
        <p style="text-align: center; font-weight: bold; color: ${colorEstado}; font-size: 18px;">Estado: ${estado}</p>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <p>🍏 <strong>Tu rango de peso ideal según tu altura:</strong></p>
        <p style="text-align: center; font-size: 16px; font-weight: bold;">
          Entre ${pesoMin.toLocaleString("es-AR", { maximumFractionDigits: 1 })} kg y ${pesoMax.toLocaleString("es-AR", { maximumFractionDigits: 1 })} kg
        </p>
        <div class="advertencia-salud">
          *Nota informativa: El IMC es una referencia general. No reemplaza a un diagnóstico médico profesional, ya que no discrimina masa muscular de grasa corporal.
        </div>
      `;

      resultadoDiv.style.display = "block";
    }
  </script>

</body>
</html>

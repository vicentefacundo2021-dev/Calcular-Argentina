<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gastos del Negocio - Calcular Argentina</title>

  <meta name="description" content="Calculá y controlá los gastos de tu negocio.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
    }

    header img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 15px;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .volver {
      display: block;
      max-width: 900px;
      margin: 10px auto 20px;
      padding: 0 20px;
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
      padding: 0 15px 30px;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #f1f2f4;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    .eliminar {
      background: #c62828;
      padding: 8px 10px;
      margin: 0;
      width: auto;
      font-size: 13px;
    }

    .total {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      text-align: center;
    }

    .total strong {
      display: block;
      color: #666;
      margin-bottom: 5px;
    }

    .total span {
      font-size: 25px;
      font-weight: bold;
    }

    .vacio {
      color: #777;
      padding: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <img src="descarga.jpeg" alt="Calcular Argentina">
    <h1>Calcular Argentina</h1>
    <p>Calculadoras online gratis</p>
  </header>

  <a class="volver" href="negocios.html">← Volver a Negocios</a>

  <div class="contenedor">

    <div class="tarjeta">

      <h2>💸 Agregar gasto</h2>

      <label for="concepto">Concepto</label>
      <input type="text" id="concepto" placeholder="Ej: Alquiler">

      <label for="categoria">Categoría</label>
      <select id="categoria">
        <option value="Alquiler">Alquiler</option>
        <option value="Servicios">Servicios</option>
        <option value="Publicidad">Publicidad</option>
        <option value="Transporte">Transporte</option>
        <option value="Sueldos">Sueldos</option>
        <option value="Impuestos">Impuestos</option>
        <option value="Otros">Otros</option>
      </select>

      <label for="monto">Monto ($)</label>
      <input type="number" id="monto" min="0" step="0.01" placeholder="Ej: 150000">

      <button onclick="agregarGasto()">➕ Agregar gasto</button>

    </div>

    <div class="tarjeta">

      <h2>📋 Mis gastos</h2>

      <div class="tabla-contenedor">

        <table>

          <thead>
            <tr>
              <th>Concepto</th>
              <th>Categoría</th>
              <th>Monto</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="listaGastos">

            <tr>
              <td colspan="4" class="vacio">
                Todavía no agregaste gastos.
              </td>
            </tr>

          </tbody>

        </table>

      </div>

      <div class="total">

        <strong>💰 Total de gastos</strong>

        <span id="totalGastos">$0</span>

      </div>

    </div>

  </div>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>

    let gastos = [];

    function formatoPesos(numero) {

      return "$" + numero.toLocaleString("es-AR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });

    }

    function agregarGasto() {

      const concepto = document
        .getElementById("concepto")
        .value
        .trim();

      const categoria = document
        .getElementById("categoria")
        .value;

      const monto = Number(
        document.getElementById("monto").value
      );

      if (!concepto) {

        alert("Ingresá el concepto del gasto.");

        return;
      }

      if (monto <= 0) {

        alert("Ingresá un monto válido.");

        return;
      }

      gastos.push({
        concepto: concepto,
        categoria: categoria,
        monto: monto
      });

      document.getElementById("concepto").value = "";
      document.getElementById("monto").value = "";

      mostrarGastos();

    }

    function eliminarGasto(indice) {

      gastos.splice(indice, 1);

      mostrarGastos();

    }

    function mostrarGastos() {

      const lista = document.getElementById("listaGastos");

      lista.innerHTML = "";

      if (gastos.length === 0) {

        lista.innerHTML = `
          <tr>
            <td colspan="4" class="vacio">
              Todavía no agregaste gastos.
            </td>
          </tr>
        `;

      } else {

        gastos.forEach((gasto, indice) => {

          lista.innerHTML += `
            <tr>
              <td>${gasto.concepto}</td>
              <td>${gasto.categoria}</td>
              <td>${formatoPesos(gasto.monto)}</td>
              <td>
                <button
                  class="eliminar"
                  onclick="eliminarGasto(${indice})">
                  Eliminar
                </button>
              </td>
            </tr>
          `;

        });

      }

      calcularTotal();

    }

    function calcularTotal() {

      let total = 0;

      gastos.forEach(gasto => {

        total += gasto.monto;

      });

      document.getElementById("totalGastos").textContent =
        formatoPesos(total);

    }

  </script>

</body>
</html>

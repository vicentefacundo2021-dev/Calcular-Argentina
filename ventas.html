<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ventas y ganancias - Calcular Argentina</title>

  <meta name="description" content="Registrá las ventas de tu negocio y compará la evolución de tus ventas día a día.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
    }

    header img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 15px;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .volver {
      display: block;
      max-width: 900px;
      margin: 10px auto 20px;
      padding: 0 20px;
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
      padding: 0 15px 30px;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .tarjeta h2 {
      margin-top: 0;
    }

    .boton-principal {
      display: block;
      width: 100%;
      padding: 15px;
      background: #222;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .boton-principal:hover {
      opacity: 0.9;
    }

    #formulario {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .guardar {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cerrar {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #f1f2f4;
    }

    .eliminar {
      background: #c62828;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    .mas {
      color: #16803c;
      font-weight: bold;
    }

    .menos {
      color: #c62828;
      font-weight: bold;
    }

    .igual {
      color: #777;
      font-weight: bold;
    }

    .vacio {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .resultado {
      background: #f5f6f8;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .resultado strong {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .resultado span {
      font-size: 19px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .resumen {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <img src="descarga.jpeg" alt="Calcular Argentina">
    <h1>Calcular Argentina</h1>
    <p>Calculadoras online gratis</p>
  </header>

  <a class="volver" href="negocios.html">← Volver a Negocios</a>

  <div class="contenedor">

    <div class="tarjeta">

      <h2>📈 Ventas y ganancias</h2>

      <button class="boton-principal" onclick="mostrarFormulario()">
        ➕ Registrar ventas
      </button>

      <div id="formulario">

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">

        <label for="ventas">Total vendido ($)</label>
        <input
          type="number"
          id="ventas"
          min="0"
          step="0.01"
          placeholder="Ej: 150000"
        >

        <button class="guardar" onclick="agregarVenta()">
          💾 Guardar venta
        </button>

        <button class="cerrar" onclick="ocultarFormulario()">
          Cancelar
        </button>

      </div>

    </div>

    <div class="tarjeta">

      <h2>📊 Evolución de ventas</h2>

      <div class="tabla-contenedor">

        <table>

          <thead>
            <tr>
              <th>Fecha</th>
              <th>Ventas</th>
              <th>Comparación</th>
              <th>Diferencia</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="listaVentas">

            <tr>
              <td colspan="5" class="vacio">
                Todavía no registraste ventas.
              </td>
            </tr>

          </tbody>

        </table>

      </div>

      <div class="resumen">

        <div class="resultado">
          <strong>💰 Total vendido</strong>
          <span id="totalVendido">$0</span>
        </div>

        <div class="resultado">
          <strong>📊 Promedio diario</strong>
          <span id="promedio">$0</span>
        </div>

        <div class="resultado">
          <strong>🏆 Mejor día</strong>
          <span id="mejorDia">-</span>
        </div>

        <div class="resultado">
          <strong>📉 Peor día</strong>
          <span id="peorDia">-</span>
        </div>

      </div>

    </div>

  </div>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>

    let ventas = [];

    function mostrarFormulario() {
      document.getElementById("formulario").style.display = "block";
    }

    function ocultarFormulario() {
      document.getElementById("formulario").style.display = "none";
    }

    function formatoPesos(numero) {
      return "$" + numero.toLocaleString("es-AR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function formatoFecha(fecha) {
      const partes = fecha.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function agregarVenta() {

      const fecha = document.getElementById("fecha").value;
      const monto = Number(document.getElementById("ventas").value);

      if (!fecha) {
        alert("Elegí una fecha.");
        return;
      }

      if (monto <= 0) {
        alert("Ingresá un monto válido.");
        return;
      }

      const existente = ventas.find(v => v.fecha === fecha);

      if (existente) {
        alert("Ya registraste ventas para esa fecha.");
        return;
      }

      ventas.push({
        fecha: fecha,
        monto: monto
      });

      ventas.sort((a, b) => a.fecha.localeCompare(b.fecha));

      document.getElementById("fecha").value = "";
      document.getElementById("ventas").value = "";

      ocultarFormulario();
      mostrarVentas();
    }

    function eliminarVenta(indice) {

      ventas.splice(indice, 1);

      mostrarVentas();
    }

    function mostrarVentas() {

      const lista = document.getElementById("listaVentas");

      lista.innerHTML = "";

      if (ventas.length === 0) {

        lista.innerHTML = `
          <tr>
            <td colspan="5" class="vacio">
              Todavía no registraste ventas.
            </td>
          </tr>
        `;

      } else {

        ventas.forEach((venta, indice) => {

          let comparacion = "—";
          let diferencia = "—";
          let clase = "igual";

          if (indice > 0) {

            const anterior = ventas[indice - 1].monto;
            const diferenciaPesos = venta.monto - anterior;

            if (anterior > 0) {

              const porcentaje =
                (diferenciaPesos / anterior) * 100;

              if (diferenciaPesos > 0) {

                comparacion =
                  "🟢 +" + porcentaje.toFixed(1) + "%";

                diferencia =
                  "+" + formatoPesos(diferenciaPesos);

                clase = "mas";

              } else if (diferenciaPesos < 0) {

                comparacion =
                  "🔴 " + porcentaje.toFixed(1) + "%";

                diferencia =
                  formatoPesos(diferenciaPesos);

                clase = "menos";

              } else {

                comparacion = "➡️ Igual";
                diferencia = "$0";
                clase = "igual";
              }

            }

          }

          lista.innerHTML += `
            <tr>
              <td>${formatoFecha(venta.fecha)}</td>

              <td>${formatoPesos(venta.monto)}</td>

              <td class="${clase}">
                ${comparacion}
              </td>

              <td class="${clase}">
                ${diferencia}
              </td>

              <td>
                <button
                  class="eliminar"
                  onclick="eliminarVenta(${indice})">
                  Eliminar
                </button>
              </td>
            </tr>
          `;
        });
      }

      calcularResumen();
    }

    function calcularResumen() {

      if (ventas.length === 0) {

        document.getElementById("totalVendido").textContent = "$0";
        document.getElementById("promedio").textContent = "$0";
        document.getElementById("mejorDia").textContent = "-";
        document.getElementById("peorDia").textContent = "-";

        return;
      }

      let total = 0;

      ventas.forEach(venta => {
        total += venta.monto;
      });

      const promedio = total / ventas.length;

      let mejor = ventas[0];
      let peor = ventas[0];

      ventas.forEach(venta => {

        if (venta.monto > mejor.monto) {
          mejor = venta;
        }

        if (venta.monto < peor.monto) {
          peor = venta;
        }

      });

      document.getElementById("totalVendido").textContent =
        formatoPesos(total);

      document.getElementById("promedio").textContent =
        formatoPesos(promedio);

      document.getElementById("mejorDia").textContent =
        formatoFecha(mejor.fecha) + " - " +
        formatoPesos(mejor.monto);

      document.getElementById("peorDia").textContent =
        formatoFecha(peor.fecha) + " - " +
        formatoPesos(peor.monto);
    }

  </script>

</body>
</html>

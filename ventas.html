    body {

    header {

    }

    h1 {

    }

    header p {
      margin: 0;

    }

    .volver {

      margin: 10px auto 20px;
      padding: 0 20px;
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    .contenedor {
      max-width: 900px;

      padding: 0 15px 30px;
    }

    .tarjeta {

    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .tabla-contenedor {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      min-width: 650px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #f1f2f4;
    }

    .eliminar {
      background: #c62828;
      padding: 8px 10px;
      margin: 0;
      width: auto;
      font-size: 13px;
    }

    .mas {
      color: #16803c;
      font-weight: bold;
    }

    .menos {
      color: #c62828;
      font-weight: bold;
    }

    .igual {
      color: #777;
      font-weight: bold;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .resultado {
      background: #f5f6f8;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .resultado strong {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .resultado span {
      font-size: 20px;
      font-weight: bold;
    }

    .vacio {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .resumen {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

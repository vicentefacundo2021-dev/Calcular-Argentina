<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Intereses - Calcular Argentina</title>

  <meta name="description" content="Calculadora de intereses simples y compuestos. Calculá el interés generado y el capital final de una inversión o préstamo.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #e1e1e1;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.7;
      display: none;
    }

    .resultado strong {
      font-size: 20px;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💰 Calculadora de Intereses</h1>
    <p>Calcular Argentina</p>
  </header>

  <main>

    <div class="calculadora">

      <label for="capital">Capital inicial</label>
      <input type="number" id="capital" placeholder="Ej: 500000">

      <label for="tasa">Tasa de interés (%)</label>
      <input type="number" id="tasa" placeholder="Ej: 5">

      <label for="tiempo">Tiempo</label>
      <input type="number" id="tiempo" placeholder="Ej: 12">

      <label for="periodo">Período de la tasa</label>
      <select id="periodo">
        <option value="mensual">Mensual</option>
        <option value="anual">Anual</option>
      </select>

      <label for="tipo">Tipo de interés</label>
      <select id="tipo">
        <option value="simple">Interés simple</option>
        <option value="compuesto">Interés compuesto</option>
      </select>

      <button onclick="calcular()">Calcular intereses</button>

      <div class="resultado" id="resultado"></div>

    </div>

    <a class="volver" href="https://vicentefacundo2021-dev.github.io/Calcular-Argentina/dinero.html">
      ← Volver a Calculadoras de Dinero
    </a>

  </main>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>
    function calcular() {

      const capital = parseFloat(document.getElementById("capital").value);
      const tasa = parseFloat(document.getElementById("tasa").value);
      const tiempo = parseFloat(document.getElementById("tiempo").value);
      const periodo = document.getElementById("periodo").value;
      const tipo = document.getElementById("tipo").value;
      const resultado = document.getElementById("resultado");

      if (
        isNaN(capital) ||
        isNaN(tasa) ||
        isNaN(tiempo) ||
        capital <= 0 ||
        tasa < 0 ||
        tiempo <= 0
      ) {
        resultado.style.display = "block";
        resultado.innerHTML = "Ingresá valores válidos.";
        return;
      }

      let interes;
      let capitalFinal;

      if (tipo === "simple") {

        interes = capital * (tasa / 100) * tiempo;
        capitalFinal = capital + interes;

      } else {

        capitalFinal = capital * Math.pow(1 + tasa / 100, tiempo);
        interes = capitalFinal - capital;

      }

      resultado.innerHTML =
        "<strong>Capital final: $" +
        capitalFinal.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) +
        "</strong><br><br>" +

        "Interés generado: $" +
        interes.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) +
        "<br><br>" +

        "Capital inicial: $" +
        capital.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

      resultado.style.display = "block";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Cuotas - Calcular Argentina</title>

  <meta name="description" content="Calculadora de cuotas online. Calculá el valor de cada cuota, el total pagado y los intereses de una financiación.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #e1e1e1;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border-radius: 8px;
      border: none;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.7;
      display: none;
    }

    .resultado strong {
      font-size: 20px;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💳 Calculadora de Cuotas</h1>
    <p>Calcular Argentina</p>
  </header>

  <main>

    <div class="calculadora">

      <label for="precio">Precio de contado</label>
      <input type="number" id="precio" placeholder="Ej: 500000">

      <label for="cuotas">Cantidad de cuotas</label>
      <input type="number" id="cuotas" placeholder="Ej: 12">

      <label for="interes">Interés total (%)</label>
      <input type="number" id="interes" placeholder="Ej: 30">

      <button onclick="calcular()">Calcular cuotas</button>

      <div class="resultado" id="resultado"></div>

    </div>

    <a class="volver" href="https://vicentefacundo2021-dev.github.io/Calcular-Argentina/dinero.html">
      ← Volver a Calculadoras de Dinero
    </a>

  </main>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>
    function calcular() {

      const precio = parseFloat(document.getElementById("precio").value);
      const cuotas = parseInt(document.getElementById("cuotas").value);
      const interes = parseFloat(document.getElementById("interes").value);
      const resultado = document.getElementById("resultado");

      if (
        isNaN(precio) ||
        isNaN(cuotas) ||
        isNaN(interes) ||
        precio <= 0 ||
        cuotas <= 0 ||
        interes < 0
      ) {
        resultado.style.display = "block";
        resultado.innerHTML = "Ingresá valores válidos.";
        return;
      }

      const montoInteres = precio * interes / 100;
      const total = precio + montoInteres;
      const valorCuota = total / cuotas;

      resultado.innerHTML =
        "<strong>Valor de cada cuota: $" +
        valorCuota.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) +
        "</strong><br><br>" +

        "Interés: $" +
        montoInteres.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) +

        "<br>Total a pagar: $" +
        total.toLocaleString("es-AR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) +

        "<br>Recargo: " + interes + "%";

      resultado.style.display = "block";
    }
  </script>

</body>
</html>

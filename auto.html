<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Gasto de Combustible - Calcular Argentina</title>

  <meta name="description" content="Calculá cuánto vas a gastar en combustible según la distancia, el consumo de tu vehículo y el precio del combustible.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #e1e1e1;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    select {
      background: white;
    }

    .precio-info {
      margin-top: 15px;
      font-size: 14px;
      color: #664d03;
      background: #fff3cd;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ffecb5;
      line-height: 1.5;
    }

    .btn-principal {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-principal:hover {
      opacity: 0.9;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
      display: none;
    }

    .resultado h3 {
      margin-top: 0;
      text-align: center;
    }

    .dato-destacado {
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      color: #0d6efd;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚗 Costo de Viaje y Combustible</h1>
  <p>Calcular Argentina</p>
</header>

<main>

  <div class="calculadora">

    <!-- DISTANCIA -->
    <label for="distancia">
      Distancia del viaje (km)
    </label>

    <input
      type="number"
      id="distancia"
      placeholder="Ej: 350"
      min="1"
      step="1"
    >

    <!-- TIPO DE VIAJE -->
    <label for="tipoViaje">
      Tipo de viaje
    </label>

    <select id="tipoViaje">
      <option value="ida">Solo ida</option>
      <option value="ida-vuelta">Ida y vuelta</option>
    </select>

    <!-- CONSUMO -->
    <label for="consumo">
      Consumo del vehículo (litros cada 100 km)
    </label>

    <input
      type="number"
      id="consumo"
      value="8"
      min="0.1"
      step="0.1"
    >

    <!-- PRECIO -->
    <label for="precio">
      Precio del combustible por litro ($)
    </label>

    <input
      type="number"
      id="precio"
      value="1100"
      min="1"
      step="1"
    >

    <div class="precio-info">
      💡 <strong>Precio de referencia:</strong>
      Actualizá este valor según el precio actual de tu estación de servicio.
    </div>

    <!-- PASAJEROS -->
    <label for="pasajeros">
      Cantidad de pasajeros
    </label>

    <input
      type="number"
      id="pasajeros"
      value="1"
      min="1"
      step="1"
    >

    <!-- BOTÓN -->
    <button
      class="btn-principal"
      onclick="calcularViaje()"
    >
      Calcular Costo del Viaje
    </button>

    <!-- RESULTADO -->
    <div
      class="resultado"
      id="resultado"
    ></div>

  </div>

  <a
    class="volver"
    href="index.html"
  >
    ← Volver al Inicio
  </a>

</main>

<footer>
  © 2026 Calcular Argentina
</footer>


<script>

  /*
   * PRECIO DE REFERENCIA
   *
   * Cuando queramos actualizar el precio
   * solamente cambiamos este número.
   */

  const PRECIO_REFERENCIA = 1100;


  /*
   * CALCULADORA
   */

  function calcularViaje() {

    const distancia =
      parseFloat(
        document.getElementById("distancia").value
      );

    const tipoViaje =
      document.getElementById("tipoViaje").value;

    const consumo =
      parseFloat(
        document.getElementById("consumo").value
      );

    const precio =
      parseFloat(
        document.getElementById("precio").value
      );

    const pasajeros =
      parseInt(
        document.getElementById("pasajeros").value
      );

    const resultado =
      document.getElementById("resultado");


    /*
     * VALIDACIÓN
     */

    if (
      isNaN(distancia) ||
      isNaN(consumo) ||
      isNaN(precio) ||
      isNaN(pasajeros) ||
      distancia <= 0 ||
      consumo <= 0 ||
      precio <= 0 ||
      pasajeros <= 0
    ) {

      resultado.style.display = "block";

      resultado.innerHTML =
        "⚠️ Por favor, completá todos los datos correctamente.";

      return;
    }


    /*
     * DISTANCIA TOTAL
     */

    let distanciaTotal = distancia;

    if (tipoViaje === "ida-vuelta") {
      distanciaTotal = distancia * 2;
    }


    /*
     * LITROS NECESARIOS
     *
     * Ejemplo:
     * 700 km × 8 / 100 = 56 litros
     */

    const litros =
      (distanciaTotal * consumo) / 100;


    /*
     * COSTO TOTAL
     */

    const costoTotal =
      litros * precio;


    /*
     * COSTO POR PERSONA
     */

    const costoPorPersona =
      costoTotal / pasajeros;


    /*
     * FORMATO DE NÚMEROS
     */

    const numero =
      valor =>
        valor.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );


    const dinero =
      valor =>
        "$" +
        valor.toLocaleString(
          "es-AR",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );


    /*
     * RESULTADO
     */

    let html = `
      <h3>📊 Resumen del viaje</h3>

      <p>
        🛣️ <strong>Distancia:</strong>
        ${distancia.toLocaleString("es-AR")} km
      </p>
    `;


    if (tipoViaje === "ida-vuelta") {

      html += `
        <p>
          🔄 <strong>Distancia total ida y vuelta:</strong>
          ${distanciaTotal.toLocaleString("es-AR")} km
        </p>
      `;
    }


    html += `
      <p>
        ⛽ <strong>Combustible necesario:</strong>
        ${numero(litros)} litros
      </p>

      <p>
        💰 <strong>Costo total del combustible:</strong>
      </p>

      <div class="dato-destacado">
        ${dinero(costoTotal)}
      </div>
    `;


    if (pasajeros > 1) {

      html += `
        <hr style="
          border:0;
          border-top:1px solid #ddd;
          margin:15px 0;
        ">

        <p>
          👥 <strong>Costo por persona:</strong>
        </p>

        <div
          class="dato-destacado"
          style="color:#198754;"
        >
          ${dinero(costoPorPersona)}
        </div>
      `;
    }


    resultado.innerHTML = html;

    resultado.style.display = "block";
  }

</script>

</body>
</html>

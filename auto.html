<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora de Gasto de Combustible - Calcular Argentina</title>

  <meta name="description" content="Calculadora de consumo de nafta y costo de viaje en auto para Argentina. Calculá los litros de combustible y cuánto dinero necesitás para tu viaje.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: white;
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      color: #666;
      margin-bottom: 0;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    .calculadora {
      background: white;
      border-radius: 15px;
      padding: 25px;
      border: 1px solid #e1e1e1;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .info-precios {
      margin-top: 15px;
      font-size: 14px;
      color: #664d03;
      background: #fff3cd;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ffecb5;
      line-height: 1.5;
    }

    .resultado {
      margin-top: 20px;
      padding: 18px;
      background: #f1f2f4;
      border-radius: 10px;
      font-size: 17px;
      line-height: 1.6;
      display: none;
    }

    .resultado h3 {
      margin-top: 0;
      text-align: center;
      color: #222;
    }

    .dato-destacado {
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      color: #0d6efd;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #222;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚗 Costo de Viaje y Combustible</h1>
    <p>Calcular Argentina</p>
  </header>

  <main>

    <div class="calculadora">

      <label for="distancia">Distancia a recorrer (Kilómetros)</label>
      <input type="number" id="distancia" placeholder="Ej: 400" min="1">

      <label for="consumo">Consumo del auto (Litros cada 100 km)</label>
      <input type="number" id="consumo" value="8" min="1" step="0.1">

      <label for="precio">Precio del combustible por litro (\$)</label>
      <input type="number" id="precio" value="1100" min="1">

      <div class="info-precios" id="bloqueInfo">
        💡 <strong>Precios de referencia (Octubre 2026):</strong> El costo varía según tu provincia. Estimado Nafta Súper: <strong>\$1.100</strong> | Premium: <strong>\$1.350</strong>. ¡Ajustá el casillero de arriba con el valor real de tu surtidor!
      </div>

      <label for="pasajeros">Cantidad de pasajeros (Para dividir gastos)</label>
      <input type="number" id="pasajeros" value="1" min="1">

      <button onclick="calcularViaje()">Calcular Costo del Viaje</button>

      <div class="resultado" id="resultado"></div>

    </div>

    <a class="volver" href="index.html">
      ← Volver al Inicio
    </a>

  </main>

  <footer>
    © 2026 Calcular Argentina
  </footer>

  <script>
    // Script dinámico para actualizar automáticamente el mes y año informativo
    window.onload = function() {
      const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const fechaActual = new Date();
      const mesActual = meses[fechaActual.getMonth()];
      const anioActual = fechaActual.getFullYear();
      
      const infoDiv = document.getElementById("bloqueInfo");
      infoDiv.innerHTML = `💡 <strong>Precios de referencia (${mesActual} ${anioActual}):</strong> El costo varía según tu provincia. Estimado Nafta Súper: <strong>$1.100</strong> | Premium: <strong>$1.350</strong>. ¡Ajustá el casillero de arriba con el valor real de tu surtidor!`;
    };

    function calcularViaje() {
      const distancia = parseFloat(document.getElementById("distancia").value);
      const consumo = parseFloat(document.getElementById("consumo").value);
      const precio = parseFloat(document.getElementById("precio").value);
      const pasajeros = parseInt(document.getElementById("pasajeros").value);
      const resultadoDiv = document.getElementById("resultado");

      if (isNaN(distancia) || isNaN(consumo) || isNaN(precio) || isNaN(pasajeros) || 
          distancia <= 0 || consumo <= 0 || precio <= 0 || pasajeros <= 0) {
        resultadoDiv.style.display = "block";
        resultadoDiv.innerHTML = "Por favor, ingresá valores válidos mayores a cero.";
        return;
      }

      const litrosTotales = (distancia * consumo) / 100;
      const costoTotal = litrosTotales * precio;
      const costoPorPasajero = costoTotal / pasajeros;

      let htmlResultado = `
        <h3>📊 Resumen del Viaje</h3>
        <p>⛽ <strong>Combustible necesario:</strong> ${litrosTotales.toLocaleString("es-AR", { maximumFractionDigits: 2 })} Litros</p>
        <p>💰 <strong>Costo total de combustible:</strong></p>
        <div class="dato-destacado">$${costoTotal.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      `;

      if (pasajeros > 1) {
        htmlResultado += `
          <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
          <p>👥 <strong>Costo por persona (${pasajeros} pasajeros):</strong></p>
          <div class="dato-destacado" style="color: #198754;">$${costoPorPasajero.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
        `;
      }

      resultadoDiv.innerHTML = htmlResultado;
      resultadoDiv.style.display = "block";
    }
  </script>

</body>
</html>
